name: Publicar Horizon

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Montar o site
        run: |
          mkdir -p _site/app _site/downloads _site/vendor scripts
          cp index.html build-bundle.js _site/
          if [ -f app/bundle.json ]; then cp app/bundle.json _site/app/; else cp bundle.json _site/app/; fi
          if [ -f downloads/launcher.zip ]; then cp downloads/launcher.zip _site/downloads/; else cp launcher.zip _site/downloads/; fi
          if [ -f downloads/Horizon.apk ]; then cp downloads/Horizon.apk _site/downloads/; else cp Horizon.apk _site/downloads/; fi
          if [ -f vendor/jszip.min.js ]; then cp vendor/jszip.min.js _site/vendor/; else cp jszip.min.js _site/vendor/; fi
          [ -f scripts/fetch-news.mjs ] || cp fetch-news.mjs scripts/
          [ -f scripts/news-lib.mjs ] || cp news-lib.mjs scripts/
          node scripts/fetch-news.mjs _site/news.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
